name: hostbook
version: "0.2.1"
requires_hermes: ">=0.22.0"
description: A dashboard for the machines and services on your network, and tools for Hermes to check and fix them under per-machine rules
author: Timidan
license: MIT
homepage: https://github.com/Timidan/hostbook
provides_tools:
  - host_run
  - host_services
  - service_action
  - hostbook_setup
provides_hooks:
  - pre_llm_call
  - pre_tool_call
